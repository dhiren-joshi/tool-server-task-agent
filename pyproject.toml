[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "bodhan-tool-agent"
version = "0.1.0"
description = "MCP tool server and task agent for Bodhan Indic models"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Dhiren Joshi" }]
dependencies = [
  "httpx==0.28.1",
  "mcp[cli]==2.3.0",
  "pydantic==2.14.4",
  "python-dotenv==1.2.2",
  "PyMuPDF==1.26.7",
  "Pillow==12.3.0",
  "pydub==0.25.1",
  "audioop-lts==0.2.2; python_version >= '3.13'",
]

[project.optional-dependencies]
dev = ["pytest==9.0.2", "ruff==0.14.8"]

[project.scripts]
bodhan-mcp = "bodhan_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
